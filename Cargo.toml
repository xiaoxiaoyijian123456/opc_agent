[package]
name = "myopc"
version = "0.1.0"
edition = "2021"
description = "myopc - My AI multi-agent team orchestrator CLI"
license = "Apache-2.0"

[[bin]]
name = "myopc"
path = "src/main.rs"

[lib]
name = "myopc"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
rustyline = "15"
colored = "2"
comfy-table = "7"
async-trait = "0.1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
libc = "0.2"

[dev-dependencies]
